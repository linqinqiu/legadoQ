name: Build legadoQ JAR

# 出可运行产物：内嵌前端的 fatJar + 标准分发包，PR 只跑测试不发布。
#
# 2026-10-26 重建：重组时这 7 个 workflow 被压成一行（0 换行 + BOM），GitHub 解析不了，
# CI 自重组起从未真的跑过。除格式外改了四处：
#   1. 路径统一到 product/ 下（Dockerfile、Gradle、web 包都在那一层）；
#   2. JDK 从 21 改回 17 —— app/build.gradle 的 toolchain 锁 17，runner 上只有 21 时
#      Gradle 会去找一个不存在的 17 直接红；
#   3. 打 fatJar 之后加一步 `bundled-ui-check`：确认"烤进包里的前端 == 刚构建的 dist"。
#      这一步是本 workflow 以前最该有却没有的 —— 产物发布出去、里面却是旧界面，
#      流水线照样全绿；
#   4. `cache-dependency-path` 指向 package-lock.json（原来指 package.json，缓存键等于没锁依赖）。
on:
  push:
    branches: [main, master]
    tags: ['v*']
    # 只动文档的推送不产出新二进制：白跑 3.5 分钟的打包，还会把 latest 的产物时间戳刷成
    # 一次没有任何代码变化的构建。GitHub 只在**分支**推送时评估 paths/paths-ignore，
    # tag 推送（发版）照跑不误 —— 这条只挡文档提交。
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: build-jar-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: product

jobs:
  build:
    name: Build & Package JAR
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # 全量历史：VersionTracks 那条判据要逐行复算 RELEASES.md 里的历史提交与 tag，
          # 默认的 fetch-depth: 1 里那些对象根本不存在，会把整表判成"提交不存在"。
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: product/web/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 与 app/build.gradle 的 toolchain 一致；写 21 会让 Gradle 找不到 17
          java-version: '17'
          cache: gradle

      - name: Build Web Client
        run: |
          npm ci --prefix web
          npm --prefix web run build

      - name: Run Web & Server Verification Tests
        env:
          LEGADO_TEST_TMP: ${{ runner.temp }}/legado-test
        run: |
          npm --prefix web run check
          # 必须经 web 包跑（cwd=product/web）：从仓库根用 npx tsx 找不到 web/tsconfig.json，
          # JSX 回落 classic 编译报 "React is not defined"，且 npx 会临时拉一个不匹配锁定版本的 tsx。
          npm --prefix web test
          chmod +x gradlew
          ./gradlew :app:test --no-daemon --console=plain

      - name: 确认随包产物那批用例是真跑的
        # 上一步之前已经构建了前端，所以 StaticAssetsHttpTest / BrandStoreTest 的前置条件成立、
        # 必须真跑。它们在前端缺失时会 assumeTrue 跳过 —— 在 ci.yml 那条只跑后端的流水线里
        # 那是诚实的，在这里就等于"产物没人验、灯还是绿的"。构建顺序哪天被挪到测试之后，
        # 这一步会红，而不是静默少跑十几条。
        run: node tools/verify/ui-tests-ran-check.mjs

      - name: Build Standalone Fat JAR & Distribution
        run: ./gradlew :app:fatJar :app:distZip --no-daemon --console=plain

      - name: 核对包内前端就是刚构建的那份
        # 服务没在跑，这一条会 SKIP 掉"运行中的实例"那一格；其余三格（dist /
        # processResources / jar 内）照样比对。
        run: node tools/verify/bundled-ui-check.mjs

      - name: Prepare Artifacts
        run: |
          mkdir -p artifacts
          cp app/build/libs/legado-*-all.jar artifacts/legado.jar
          if ls app/build/distributions/*.zip > /dev/null 2>&1; then
            cp app/build/distributions/*.zip artifacts/legado-dist.zip
          fi
          echo "=== Built Artifacts ==="
          ls -lh artifacts/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: legado-binaries
          path: product/artifacts/*
          if-no-files-found: error
          retention-days: 90

      - name: Determine Release Tag & Name
        id: release_meta
        if: github.event_name != 'pull_request'
        run: |
          BUILD_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "release_name=legadoQ ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=latest" >> "$GITHUB_OUTPUT"
            echo "release_name=legadoQ Continuous Build (latest)" >> "$GITHUB_OUTPUT"
          fi

      - name: Recreate latest release & tag
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 删除旧的 latest Release，确保新建时 GitHub 发布时间戳刷新为最新
          gh release delete latest --yes || true
          # 更新并强制推送 latest Git Tag 指向当前 Commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${{ github.sha }}"
          git push --force origin refs/tags/latest:refs/tags/latest

      # 发布说明不能只有「本 Release 由 Actions 生成」——用户点进来要知道**这版改了什么**、
      # **怎么跑起来**。更新内容直接从 `product/CHANGELOG.md` 摘，避免第二份手写日志漂移；
      # 滚动构建（latest）没有对应版本，退回文件里最新的一段并注明。
      - name: Compose release notes (changelog + quick start)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          TAG="${{ steps.release_meta.outputs.tag_name }}"
          VERSION="${TAG#v}"

          # 从 `## [x.y.z]` 摘到下一个 `## [` 之前。
          awk -v needle="[$VERSION]" '
            /^## \[/ { if (found) exit; if (index($0, needle) > 0) found = 1 }
            found { print }
          ' product/CHANGELOG.md > /tmp/section.md

          if [ -s /tmp/section.md ]; then
            : > /tmp/section-prefix.md
          else
            # 滚动构建：没有版本段落，取最新那一段，并说明它不是本版专属。
            awk '/^## \[/ { if (n++) exit; p = 1 } p' product/CHANGELOG.md > /tmp/section.md
            printf '> main 的滚动构建：下面是最近一版的更新记录。\n\n' > /tmp/section-prefix.md
          fi

          {
            cat /tmp/section-prefix.md
            cat /tmp/section.md
            cat <<'MD'

          ## 这是什么

          legadoQ 是一个跑在本机的阅读器服务：书源规则引擎 + 书架 + AI 助手，浏览器打开就能读。
          数据全部留在本机（默认 `./data`），不联云、不需要账号。

          ## 怎么用

          1. 装 Java 17 或更新版本
          2. 下载下面的 `legado.jar`，执行 `java -jar legado.jar`
          3. 浏览器打开 http://127.0.0.1:1234
          4. 第一次进来：先去「书源 → 导入」放一份书源，再去「书库」搜书

          换端口或数据目录：

          ```bash
          LEGADO_PORT=8080 LEGADO_DATA_DIR=./data java -jar legado.jar
          ```

          ## 产物

          | 文件 | 用途 |
          |---|---|
          | `legado.jar` | 单文件版：前端、后端、依赖全在里面，`java -jar` 即用 |
          | `legado-dist.zip` | 标准分发包：含 `bin/` 启动脚本与依赖库 |

          ## 从旧版升级

          直接换掉 jar 再启动即可，数据目录不动就不会丢书、书源和阅读进度。
          升级前想留个退路：停服后把 `data/` 整个复制一份。
          MD

            printf '\n## 构建信息\n\n- Commit: [`%s`](https://github.com/%s/commit/%s)\n- Ref: `%s`\n- 构建时间: `%s` (UTC+8)\n' \
              "${GITHUB_SHA:0:7}" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "${{ github.ref_name }}" "${{ steps.release_meta.outputs.build_time }}"
          } > release-body.md

          echo "=== release-body.md ==="
          head -40 release-body.md

      - name: Auto Publish / Update GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_meta.outputs.release_name }}
          # 正文由上一步从 CHANGELOG + 使用简介拼出来；这里不再内联，免得两处漂移。
          body_path: release-body.md
          draft: false
          prerelease: false
          # 只有版本 tag（v*）能当 “Latest”。滚动构建是 main 的连续产物，
          # 若它也置 true，每次推 main 都会把 Latest 从版本页抢走（2026-11-06 实测：
          # v0.2.19 发布后两次 docs 推送，Latest 徽章就落回了 Continuous Build）。
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
          files: |
            product/artifacts/legado.jar
            product/artifacts/legado-dist.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
