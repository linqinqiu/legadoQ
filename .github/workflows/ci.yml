# CI —— 前后端基础门禁（PR 与 main push 都跑）
#
# 2026-10-26 重建。原因不是"路径要改"这么简单：仓库重组（两层并一层、代码进 product/）时，
# 这 7 个 workflow 被整体压成**一行**（0 个换行、还带 BOM），GitHub 无法解析 ——
# 也就是说自重组起 CI 一次都没真跑过，而本地一直是绿的，所以没人发现。
# 重写时顺手做了三件事：
#   1. 路径统一到 product/ 下（用 defaults.run.working-directory，不在每条命令前拼前缀）；
#   2. JDK 统一 17（app/build.gradle 的 toolchain 锁 17，配 21 会因机器上没有 17 而红）；
#   3. 前端依赖从 `npm install` 改成 `npm ci`（锁文件说了算，CI 不该顺手升级依赖）。
name: CI Test & Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: product

jobs:
  server-test:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # toolchain 锁 17：给 21 会让 Gradle 去找一个装了的 17 而失败
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Server Tests
        env:
          # 测试库建在 java.io.tmpdir；指到 runner 的临时目录，避开沙箱/杀软对系统临时目录上锁。
          # 目录不存在时 build.gradle 会自己建、建不出来就回落系统默认 —— 之前直接透传一个
          # 没人创建的路径，Files.createTempFile 抛 NoSuchFileException，一轮红了 270 条。
          LEGADO_TEST_TMP: ${{ runner.temp }}/legado-test
        # 这个 job **故意不构建前端**：它是纯后端的快反馈通道。判"随包产物"的那两个类
        # （StaticAssetsHttpTest / BrandStoreTest）在前端缺失时会声明前置条件不成立而跳过，
        # 它们在 build-jar.yml 里跟着真实产物一起跑，那边还有 ui-tests-ran-check 兜着不许跳。
        run: |
          chmod +x gradlew
          ./gradlew :app:test --no-daemon --console=plain

  web-check:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: product/web/package-lock.json

      - name: Install dependencies
        # 装的是 web 包的依赖；product 根那份 package.json 只有脚本没有运行时依赖
        run: npm ci --prefix web

      # 这个 job 不装 JDK，所以只跑前端那三条（product 根的 `npm run build` / `npm test`
      # 会去调 Gradle，在这个 job 里必然红）。
      - name: Typecheck & Build
        run: |
          npm --prefix web run check
          npm --prefix web run build

      - name: Run Web Test Suite
        # 走 npm test（= tsx test/run-all.ts）而不是裸 npx tsx：cwd 必须是 web 包，
        # 否则 tsconfig 找不到、JSX 回落 classic 编译，报的是"React is not defined"这种假错。
        run: npm --prefix web test

  # 版本号只有一个真源（app/build.gradle），其余全是抄本。历次漂移（README、VERSION、
  # package.json 集体滞后）都发生在这里 —— 所以放 PR 阶段比，而不是等打 Tag 才发现发不出去。
  version-consistency:
    name: Version Single Source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check version consistency
        run: node scripts/version-check.mjs
