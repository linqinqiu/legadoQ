name: Docs & Version Gate

# 只跑"抄本一致性"这一类判据，几秒结束，不构建、不装依赖。
#
# 为什么单独一个 workflow：`build-jar.yml` 为了不给纯文档提交白打一次包，对 `docs/**`
# 与 `**/*.md` 设了 `paths-ignore` —— 于是最该被守的文档改动反而不触发任何 CI，
# 漂移就这么留下来了（0.2.41 发布时 `docs/STATUS.md` 还写着 0.2.40 / build 53，
# `docs/API-REFERENCE.md` 还写着 0.2.39，而当时的流水线一条都不查）。
#
# 三个判据的分工：
#   version:check    版本号与 build 号的真源（build.gradle / BUILD_NUMBER）vs 8 处抄本
#   docs:api-check   agent-api.json（`GET /api/catalog` 的契约）vs 生成的 API 参考
#   changelog:check  fix/feat 提交必须进 CHANGELOG
#
# 不覆盖：`product/.env.example` 与 `AppConfig` 的键集合一致性由 Kotlin 判据
# `AppConfigEnvWiringTest` 守，跟着 `:app:test` 跑（改配置项必然伴随代码改动，会触发构建流水线）。

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'product/docs/**'
      - '**/*.md'
      - 'VERSION'
      - 'BUILD_NUMBER'
      - 'package.json'
      - 'product/package.json'
      - 'product/web/package.json'
      - 'product/app/build.gradle'
      - 'product/app/src/main/resources/agent-api.json'
      - 'product/scripts/version-check.mjs'
      - 'product/scripts/gen-api-reference.mjs'
      - 'product/scripts/changelog.mjs'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs & Version Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: product
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # changelog:check 要按提交边界回溯，浅克隆里那些对象不存在。
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 三条脚本只用 node 内置模块（fs / path / child_process），所以不装依赖也能跑。
      - name: 版本 / 端点 / 更新日志一致性
        run: |
          npm run version:check
          npm run docs:api-check
          npm run changelog:check
