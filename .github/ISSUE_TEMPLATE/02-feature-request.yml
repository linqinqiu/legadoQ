name: "功能请求"
description: "为 legadoQ 提出新功能或体验改进"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议。提交前请先搜索 Issues，确认没有相似提案。
        如果只是使用上的疑问，请到 Discussions 提问，不必开 Issue。

  - type: checkboxes
    attributes:
      label: "前置核对"
      options:
        - label: "已搜索现有 Issues，未发现相似提案"
          required: true
        - label: "该功能符合 legadoQ「本机服务端 + 浏览器界面」的定位"
          required: true

  - type: dropdown
    id: category
    attributes:
      label: "功能分类"
      options:
        - "Web 阅读器体验（排版、翻页、主题、快捷键）"
        - "TTS 朗读（音色、会话控制、快捷操作）"
        - "书源与规则（解析、搜索、替换净化、导入导出）"
        - "服务端与 API（鉴权、数据备份、同步）"
        - "离线与 PWA"
        - "外观（皮肤、壁纸、自定义背景）"
        - "部署与运维（桌面版、Docker、配置项、性能）"
        - "其他"
    validations:
      required: true

  - type: textarea
    id: problem-statement
    attributes:
      label: "需求背景"
      description: "当前遇到了什么不便？为什么现有做法不够用？"
      placeholder: "例如：在宽屏上阅读时，双栏排版的间距……"
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: "期望方案"
      description: "描述期望的交互、界面表现或接口设计。"
      placeholder: "例如：在设置中增加……，默认值为……。"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "备选方案"
      description: "是否考虑过其他实现方式？"
    validations:
      required: false

  - type: textarea
    id: mockups
    attributes:
      label: "参考设计"
      description: "如有截图或草图，请直接粘贴到此处。"
    validations:
      required: false
