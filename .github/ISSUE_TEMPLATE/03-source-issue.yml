name: "书源兼容性反馈"
description: "反馈某一份书源在 legadoQ 中解析、搜索、目录或正文抓取失败"
title: "[Source]: "
labels: ["book-source"]
body:
  - type: markdown
    attributes:
      value: |
        本模板只用于**特定书源**的兼容性问题。
        如果所有书源都失败，或界面本身出错，请改用「Bug 报告」模板。
        目标站点下线、封 IP 或要求验证码属于源站问题，无法通过修改解析器解决。

  - type: checkboxes
    attributes:
      label: "前置核对"
      options:
        - label: "该书源在原版 Legado（Android 阅读）中确认能正常解析"
          required: true
        - label: "已确认目标站点当前可访问，不是站点宕机或封禁 IP"
          required: true
        - label: "已附上可复现的书名或搜索关键字"
          required: true

  - type: input
    id: source-name
    attributes:
      label: "书源名称"
      placeholder: "例如：某某小说网"
    validations:
      required: true

  - type: input
    id: source-url
    attributes:
      label: "书源地址"
      placeholder: "例如：https://example.com"
    validations:
      required: true

  - type: input
    id: test-book
    attributes:
      label: "测试书名或搜索关键字"
      placeholder: "例如：诡秘之主"
    validations:
      required: true

  - type: dropdown
    id: failure-stage
    attributes:
      label: "失败阶段"
      options:
        - "搜索（无结果或超时）"
        - "详情与发现（元数据解析失败）"
        - "目录（列表为空或规则报错）"
        - "正文（为空、乱码或净化异常）"
        - "登录与 Cookie"
        - "音频、漫画或文件类型源"
    validations:
      required: true

  - type: textarea
    id: source-json
    attributes:
      label: "书源 JSON（可去除敏感凭据）"
      description: "请粘贴完整书源定义，或提供可公开访问的导出链接。"
      placeholder: "```json\n{\n  \"bookSourceUrl\": \"...\"\n}\n```"
      render: json
    validations:
      required: true

  - type: textarea
    id: error-log
    attributes:
      label: "服务端报错"
      description: "从安装根的 `server.log` 复制相关片段；没有报错可留空。"
      placeholder: "```\n在此粘贴日志\n```"
      render: shell
    validations:
      required: false
