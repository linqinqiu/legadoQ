name: "Bug 报告"
description: "提交 legadoQ 服务端或 Web 界面的缺陷与异常"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索 Issues，确认不是重复问题。
        如果问题只在**某一份书源**上出现（搜索为空、正文取不到、登录失败），请改用「书源兼容性反馈」模板。

  - type: checkboxes
    attributes:
      label: "前置核对"
      options:
        - label: "已搜索现有 Issues，未发现相同或相似的问题"
          required: true
        - label: "使用的是最新版本（关于页显示的版本号）"
          required: true
        - label: "已查看服务端日志与浏览器控制台，确认存在报错或明确异常"
          required: true

  - type: dropdown
    id: module
    attributes:
      label: "影响模块"
      options:
        - "Web 阅读器（阅读、目录、排版、翻页、快捷键）"
        - "服务端核心（Ktor API、SQLite、数据持久化）"
        - "书源解析引擎（Rhino 沙箱、搜索、换源）"
        - "TTS 朗读（音色、会话控制、音频流）"
        - "离线缓存与 PWA（IndexedDB、Service Worker）"
        - "外观（皮肤、壁纸、自定义背景）"
        - "部署与启动（桌面版、本地 jar、Docker）"
        - "其他 / 未知"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "问题描述"
      description: "说明实际看到的现象，以及与预期不符之处。"
      placeholder: "例如：开启连续朗读后切换到下一章，进度条没有更新。"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "复现步骤"
      description: "尽量给出最小、可重复的步骤。"
      placeholder: |
        1. 打开……
        2. 点击……
        3. 观察到……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "期望行为"
      description: "正常情况下应该发生什么。"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: "错误日志与控制台输出"
      description: "服务端日志默认写在安装根的 `server.log`；浏览器报错请从开发者工具复制。"
      placeholder: "```\n在此粘贴日志\n```"
      render: shell
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: "运行环境"
      description: "版本号以「关于」页显示为准，不要凭印象填写。"
      value: |
        - 安装方式：桌面版 / 本地 jar / Docker / 源码运行
        - 版本号：
        - 操作系统：
        - 浏览器与版本：
        - 是否修改过端口或绑定地址：
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: "截图或录屏"
      description: "可以直接拖拽或粘贴到此处。"
    validations:
      required: false
