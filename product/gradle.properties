# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ── JVM 参数（构建期唯一真正管用的一行）─────────────────────────────────────
# 这里踩过一次：原来写 -Xmx6g，而 app/build.gradle 的注释自己就记着「本机 24GB →
# 要 6GB 提交空间 … 崩溃日志落在 app/ 下」。实测 30 份 hs_err_pid*.log 全部来自
# Gradle 构建链（26 个 Test Executor + 3 个 daemon + 1 个 wrapper），没有一份来自
# 服务进程 —— 也就是这个 6g 才是那批崩溃日志的来源，不是服务本身。
# 改成 2g：Kotlin 编译这个体量的工程够用，同时给同机跑的 headless Chrome 门禁留出内存。
# 需要更大时用环境变量临时覆盖：GRADLE_OPTS="-Xmx4g" 或改这一行。
org.gradle.jvmargs=-XX:+UseParallelGC -Xmx2g -Xms256m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# ── Gradle 行为 ────────────────────────────────────────────────────────────
# 并行构建：本仓库只有 :app 一个子项目，开不开无差别，保持关闭。
# org.gradle.parallel=true
# https://blog.gradle.org/introducing-file-system-watching
org.gradle.vfs.watch=true
# enable cache can not up app version
org.gradle.unsafe.configuration-cache=false

# ── Kotlin ────────────────────────────────────────────────────────────────
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# kotlin.incremental.useClasspathSnapshot=true

