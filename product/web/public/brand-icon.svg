<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4636C9"/>
      <stop offset="100%" stop-color="#7B5BFF"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDE9FF"/>
    </linearGradient>
  </defs>
  <!-- 底：MD3 的 squircle（圆角矩形），深靛→紫的斜向渐变 -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- 一页纸：整个图标的主体，小尺寸下也认得出 -->
  <rect x="132" y="120" width="248" height="272" rx="28" fill="url(#page)"/>
  <!-- 正文条：只在上半部分，给下面的 Q 留位置 -->
  <g fill="#BFB2FF">
    <rect x="172" y="178" width="112" height="22" rx="11"/>
    <rect x="172" y="224" width="140" height="22" rx="11"/>
  </g>
  <!-- 书签带（琥珀）：小尺寸下最显眼的那一点，也把「在读」这层意思带出来 -->
  <path d="M300 120h56v152l-28-26-28 26z" fill="#FFB648"/>
  <!-- 「Q」：圆环 + 尾巴，压在纸的下半部 -->
  <g fill="none" stroke="#4636C9" stroke-width="20" stroke-linecap="round">
    <circle cx="250" cy="330" r="42"/>
    <path d="M282 360l32 32"/>
  </g>
</svg>
