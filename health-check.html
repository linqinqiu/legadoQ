<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>legadoQ 健康检查</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-align: center;
        }
        .status {
            text-align: center;
            margin: 30px 0;
        }
        .status-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            animation: pulse 2s infinite;
        }
        .success {
            background: #10b981;
            box-shadow: 0 0 20px #10b981;
        }
        .error {
            background: #ef4444;
            box-shadow: 0 0 20px #ef4444;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }
        .info {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .info-item:last-child {
            border-bottom: none;
        }
        .label {
            font-weight: 600;
        }
        .value {
            font-family: monospace;
        }
        .button-container {
            text-align: center;
            margin-top: 30px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #fff;
            color: #667eea;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.3);
        }
        .link {
            color: #ffd93d;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 legadoQ v0.2.34</h1>
        
        <div class="status">
            <div id="statusCircle" class="status-circle error">❌</div>
            <h2 id="statusText">正在检查服务...</h2>
        </div>
        
        <div class="info" id="infoBox" style="display: none;">
            <div class="info-item">
                <span class="label">服务地址:</span>
                <span class="value" id="serviceAddress">-</span>
            </div>
            <div class="info-item">
                <span class="label">运行状态:</span>
                <span class="value" id="uptime">-</span>
            </div>
            <div class="info-item">
                <span class="label">版本信息:</span>
                <span class="value" id="version">-</span>
            </div>
            <div class="info-item">
                <span class="label">构建号:</span>
                <span class="value" id="buildNumber">-</span>
            </div>
        </div>
        
        <div class="button-container">
            <a href="http://127.0.0.1:1234" class="btn">访问主界面</a>
            <a href="https://t.me/legadoQ" class="btn" target="_blank">Telegram 群组</a>
        </div>
        
        <p style="text-align: center; margin-top: 30px; opacity: 0.8;">
            🎉 恭喜！legadoQ 已成功启动<br/>
            点击"访问主界面"开始使用
        </p>
    </div>

    <script>
        async function checkService() {
            try {
                const response = await fetch('http://127.0.0.1:1234/healthz');
                const data = await response.json();
                
                if (response.ok && data.status === 'RUNNING') {
                    // 成功状态
                    document.getElementById('statusCircle').className = 'status-circle success';
                    document.getElementById('statusCircle').innerHTML = '✅';
                    document.getElementById('statusText').textContent = '服务正常';
                    
                    // 显示详细信息
                    document.getElementById('infoBox').style.display = 'block';
                    document.getElementById('serviceAddress').textContent = 'http://127.0.0.1:1234';
                    document.getElementById('version').textContent = data.version || data.title || '未知版本';
                    document.getElementById('buildNumber').textContent = data.build || data.buildNumber || '未知构建';
                    
                    // 计算运行时间
                    if (data.startedAtMs) {
                        const uptimeMs = Date.now() - data.startedAtMs;
                        const uptimeSeconds = Math.floor(uptimeMs / 1000);
                        const uptimeMinutes = Math.floor(uptimeSeconds / 60);
                        const uptimeHours = Math.floor(uptimeMinutes / 60);
                        
                        if (uptimeHours > 0) {
                            document.getElementById('uptime').textContent = `${uptimeHours}小时 ${uptimeMinutes % 60}分钟`;
                        } else if (uptimeMinutes > 0) {
                            document.getElementById('uptime').textContent = `${uptimeMinutes}分钟 ${uptimeSeconds % 60}秒`;
                        } else {
                            document.getElementById('uptime').textContent = `${uptimeSeconds}秒`;
                        }
                    }
                    
                    // 自动跳转到主界面（可选）
                    // setTimeout(() => window.location.href = 'http://127.0.0.1:1234', 3000);
                } else {
                    throw new Error(data.message || '服务异常');
                }
            } catch (error) {
                console.error('Health check failed:', error);
                document.getElementById('statusCircle').className = 'status-circle error';
                document.getElementById('statusCircle').innerHTML = '❌';
                document.getElementById('statusText').textContent = '服务未启动';
                
                // 提供错误提示
                document.querySelector('.button-container').innerHTML = `
                    <a href="#" onclick="location.reload()" class="btn">重试</a>
                    <a href="start.cmd" class="btn" download>下载启动脚本</a>
                `;
            }
        }
        
        // 定期检查服务
        checkService();
        setInterval(checkService, 5000);
    </script>
</body>
</html>
